<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>ミラー配信カレンダー ｜ e活</title>
  <meta name="description" content="e活が協賛するeスポーツ大会の開催日と、応援配信（ミラー配信）の参加状況をカレンダーで確認できます。" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="ミラー配信カレンダー ｜ e活" />
  <meta property="og:description" content="e活が協賛するeスポーツ大会の開催日と、応援配信の参加状況をカレンダーで確認できます。" />
  <meta property="og:image" content="assets/img/hero.jpg" />

  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/img/favicon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/assets/img/favicon-512.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/img/favicon-180.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="assets/css/styles.css" />

  <style>
  /* ===== ミラー配信カレンダー（2026-09-06 新設）=====
     サイトの :root（白地・暖色グレー・ミニマル）を土台にして、
     ツールとして要る「状態の色」だけを足している。青は使わない（サイトの世界に無い色のため）。 */
  .cal{
    --cal-surface:#faf9f7;
    --cal-surface-2:#f2efeb;
    --cal-line:#e6e2dd;
    --cal-line-strong:#d6d0c8;
    --cal-ink:#14110f;
    --cal-ink-2:#4a443f;
    --cal-muted:#8c8682;
    --cal-go:#2e6b4f;        /* 配信する人が決まっている */
    --cal-go-soft:#e8f0ea;
    --cal-open:#a06a2c;      /* 募集中 */
    --cal-open-soft:#f7efe3;
    --cal-today:#b33a2b;     /* 今日 */
    --cal-today-soft:#faece9;
    --cal-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    max-width:1120px;margin:0 auto;padding:0 20px 80px;color:var(--cal-ink);
  }
  .cal *{box-sizing:border-box}


  /* ★スマホでも minmax(0,1fr)。ただの 1fr は minmax(auto,1fr) なので、
     中身（大会名など）の最小幅で列が押し広げられて、パネルごと画面の外へ出る。
     2026-09-06にカレンダーの升目で踏んだのと同じ罠を、ここでもう一度踏んだ。 */
  .cal__cols{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:30px;align-items:start}
  @media(max-width:900px){.cal__cols{grid-template-columns:minmax(0,1fr);gap:24px}}

  /* 月の行＝「2026年 9月 …… [◯◯さんとして開いています] [← 前の月][今月][次の月 →]」の1列。
     名前のタグはここに置く（見出しの下だと宙に浮いて見えた・2026-09-06 依田） */
  .cal__mon{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;margin-bottom:14px}
  .cal__mon .cal__me{margin-left:auto}
  .cal__mlabel{font-family:var(--cal-mono);font-size:18px;font-weight:600;letter-spacing:.02em}
  .cal__nav{display:flex;gap:6px}
  .cal__nav button{font-family:inherit;font-size:13px;color:var(--cal-ink-2);background:#fff;
    border:1px solid var(--cal-line-strong);border-radius:4px;padding:6px 13px;cursor:pointer;line-height:1.5}
  .cal__nav button:hover{background:var(--cal-surface-2)}
  .cal__nav button:focus-visible{outline:2px solid var(--cal-ink);outline-offset:1px}

  /* ★minmax(0,1fr) にしないと、升目の中身（大会名）の幅で列が押し広げられて
     グリッドが親からはみ出し、右のパネルの下に潜る（2026-09-06 実際に起きた）。
     1fr は minmax(auto,1fr) の略なので、auto＝中身の最小幅が効いてしまう。 */
  .cal__dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-bottom:5px}
  .cal__dow span{text-align:center;font-size:11px;letter-spacing:.1em;color:var(--cal-muted);padding:3px 0}
  .cal__dow span:first-child{color:var(--cal-today)}

  .cal__grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
  .cal__cell{position:relative;min-width:0;min-height:92px;background:var(--cal-surface);
    border:1px solid var(--cal-line);text-decoration:none;
    border-radius:4px;padding:6px;text-align:left;cursor:pointer;font-family:inherit;color:inherit;
    display:flex;flex-direction:column;gap:3px}
  .cal__cell:hover{background:var(--cal-surface-2);border-color:var(--cal-line-strong)}
  .cal__cell:focus-visible{outline:2px solid var(--cal-ink);outline-offset:1px}
  .cal__cell.is-blank{background:transparent;border-color:transparent;cursor:default}
  .cal__cell.is-blank:hover{background:transparent}
  /* 大会が無い日はリンクにしない（押しても何も無いページに飛ばさない） */
  .cal__cell.is-nolink{cursor:default}
  .cal__cell.is-nolink:hover{background:var(--cal-surface);border-color:var(--cal-line)}
  .cal__num{font-family:var(--cal-mono);font-size:13px;color:var(--cal-ink-2);
    font-variant-numeric:tabular-nums;line-height:1.3}
  .cal__cell.is-sun .cal__num{color:var(--cal-today)}
  .cal__cell.is-today{border-color:var(--cal-today);background:var(--cal-today-soft)}
  .cal__cell.is-today .cal__num{color:var(--cal-today);font-weight:700}
  .cal__cell.is-sel{border-color:var(--cal-ink);border-width:2px;padding:5px}
  .cal__cell.is-past{opacity:.42}

  /* 升目の大会名は2行まで折り返す。1行で「…」に切ると101px幅では「20:00 KCARZ C…」までしか読めない */
  .cal__ev{font-size:11px;line-height:1.35;padding:2px 5px;border-radius:3px;overflow:hidden;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word;
    min-width:0;border-left:3px solid var(--cal-open);
    background:var(--cal-open-soft);color:var(--cal-ink-2)}
  .cal__ev.is-filled{border-left-color:var(--cal-go);background:var(--cal-go-soft)}
  .cal__more{font-size:10px;color:var(--cal-muted);padding-left:2px}

  .cal__panel{background:var(--cal-surface);border:1px solid var(--cal-line);border-radius:6px;
    padding:20px;position:sticky;top:16px}
  @media(max-width:900px){.cal__panel{position:static}}
  .cal__panel h2{margin:0 0 14px;font-family:var(--cal-mono);font-size:17px;font-weight:600;letter-spacing:.01em}
  .cal__dsub{color:var(--cal-muted);font-size:12px;margin:0 0 18px}

  /* 右側＝近いうちの大会。1日1ブロック、押すとその日の詳細ページへ。 */
  .cal__up{display:block;text-decoration:none;color:inherit;background:#fff;
    border:1px solid var(--cal-line);border-radius:5px;padding:11px 13px;margin-bottom:8px}
  .cal__up:hover{border-color:var(--cal-line-strong);background:var(--cal-surface-2)}
  .cal__up:focus-visible{outline:2px solid var(--cal-ink);outline-offset:1px}
  .cal__up.is-today{border-color:var(--cal-today)}
  .cal__up-day{font-family:var(--cal-mono);font-size:12.5px;font-weight:600;color:var(--cal-ink-2);
    margin-bottom:5px;font-variant-numeric:tabular-nums}
  .cal__up.is-today .cal__up-day{color:var(--cal-today)}
  /* 1大会1行。KV → （時間＋大会名 ／ 配信者）の2段。狭くても押し出さないよう min-width:0 を通す。 */
  .cal__up-ev{display:flex;gap:9px;align-items:center;min-width:0;padding:4px 0}
  /* KVは切り抜かない（contain）。主催者からお預かりしたものなので、縮小と配置だけにする。 */
  .cal__up-kv{width:46px;height:29px;flex:none;object-fit:contain;background:#e9e5e0;border-radius:3px}
  .cal__up-body{flex:1 1 auto;min-width:0}
  .cal__up-top{display:flex;gap:7px;align-items:baseline;min-width:0;font-size:12.5px;line-height:1.5}
  .cal__up-time{font-family:var(--cal-mono);color:var(--cal-muted);flex:none;
    font-variant-numeric:tabular-nums}
  .cal__up-name{font-weight:500;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap}
  .cal__up-who{font-size:11px;color:var(--cal-go);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;line-height:1.5}
  .cal__up-who.is-open{color:var(--cal-open)}
  .cal__up-note{margin:10px 0 0;font-size:11.5px;color:var(--cal-muted);line-height:1.7}
  /* 「◯◯さんとして開いています」。カレンダーの右上に寄せる（月の切替ボタンと右端をそろえる） */
  .cal__me{margin:0;font-size:12.5px;background:var(--cal-go-soft);
    color:var(--cal-go);border-radius:99px;padding:4px 13px;white-space:nowrap}

  .cal__empty{color:var(--cal-muted);font-size:13px;padding:28px 0;text-align:center}
  .cal__foot{margin-top:26px;padding-top:14px;border-top:1px solid var(--cal-line);
    color:var(--cal-muted);font-size:11.5px;display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between}
  .cal__legend{display:flex;gap:16px;flex-wrap:wrap}
  .cal__legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
  .cal__notice{background:#fff;border:1px solid var(--cal-line);border-left:3px solid var(--cal-ink);
    border-radius:4px;padding:12px 15px;font-size:12.5px;color:var(--cal-ink-2);
    line-height:1.8;margin-bottom:22px}
  .cal__notice b{font-weight:700}

  /* ===== スマホ =====
     1マスが44pxしかなく、大会名を入れても全部切れて読めなかった（2026-09-06 実測）。
     升目では「その日に大会があるか」だけを色の帯で示し、中身は日を選んで下で読む形にする。
     Googleカレンダーのスマホ表示と同じ考え方。 */
  @media(max-width:560px){
    .cal{padding:0 12px 60px}
    .cal__cell{min-height:54px;padding:5px 3px;gap:2px;align-items:stretch}
    .cal__num{font-size:12px;text-align:center}
    .cal__ev{display:block;height:4px;padding:0;border-left:0;border-radius:2px;
      background:var(--cal-open);font-size:0;line-height:0}
    .cal__ev.is-filled{background:var(--cal-go)}
    .cal__more{display:none}
    .cal__cell.is-sel{padding:4px 2px}
    .cal__panel{padding:16px 15px}
    .cal__mon .cal__me{margin-left:0;width:100%;text-align:center}
  }
  </style>
</head>
<body>
  <!-- 縦書きの飾り（side-rail）はこのページでは出さない。
       画面の左右端に固定で置かれるので、幅広のカレンダーだと升目の上に乗って読めなくなる（2026-09-06 依田のスクショで確認）。 -->

  <header class="site-header" id="top">
    <nav class="nav">
      <a href="index.html#message">ご挨拶</a>
      <a href="works.html">協賛大会</a>
      <a href="calendar.html">カレンダー</a>
      <a href="reports.html">協賛レポート</a>
      <a href="sponsors.html">共同スポンサー</a>
      <a href="index.html#vtuber">VTuber</a>
      <a href="index.html#news">お知らせ</a>
      <a href="index.html#contact">お問い合わせ</a>
    </nav>
    <a href="index.html" class="brand">
      <img src="assets/img/logo.webp" alt="e活 ロゴ" width="120" />
    </a>
  </header>

  <main>
    <section class="page-head">
      <p class="eyebrow">calendar</p>
      <h1 class="page-head__title">ミラー配信カレンダー</h1>
      <p class="page-head__lead">e活が協賛する大会の開催日と、ご自身の参加状況です。<br />日付を押すと、大会の詳細と、参加のご回答ページへ進みます。</p>
    </section>

    <section class="cal">
      <!-- 案内は見出しの下に1セットでまとめた（2026-09-06 依田の指示）。この枠は読み込めなかった時だけ出す。 -->
      <p class="cal__notice" id="calNotice" hidden></p>

      <div class="cal__cols">
        <div class="cal__main">
          <!-- 「◯◯さんとして開いています」はカレンダーの右上に。見出しの下だと浮いて見えた（2026-09-06 依田） -->
          <div class="cal__mon">
            <div class="cal__mlabel" id="calMlabel">　</div>
            <p class="cal__me" id="calMe" hidden></p>
            <div class="cal__nav">
              <button id="calPrev" type="button">← 前の月</button>
              <button id="calToday" type="button">今月</button>
              <button id="calNext" type="button">次の月 →</button>
            </div>
          </div>
          <div class="cal__dow"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div>
          <div class="cal__grid" id="calGrid"></div>
          <div class="cal__foot">
            <div class="cal__legend">
              <span><i style="background:var(--cal-go)"></i>配信する方が決まっている</span>
              <span><i style="background:var(--cal-open)"></i>募集中</span>
              <span><i style="background:var(--cal-today)"></i>今日</span>
            </div>
            <div id="calGen"></div>
          </div>
        </div>

        <div class="cal__panel">
          <h2 id="calDlabel">本日の大会</h2>
          <div id="calUpcoming"></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <img src="assets/img/logo.webp" alt="e活 ロゴ" width="90" class="site-footer__logo" />
    <p class="site-footer__copy">&copy; <a href="https://alonzo.jp" target="_blank" rel="noopener">A&amp;L project 株式会社</a> / e活</p>
  </footer>

  <script src="assets/js/main.js"></script>
  <script>
  (function () {
    var DOW = ['日','月','火','水','木','金','土'];
    var byDate = new Map();
    var DATA = { members: [], events: [], generatedAt: null };
    var now = new Date();
    var todayKey = fmt(now);
    var params = new URLSearchParams(location.search);
    // 本人だけに配る合言葉。あれば詳細ページまで持っていく（そちらで回答するのに使う）。
    var secret = params.get('k') || '';
    var start = params.get('d') || '';
    var view = /^\d{4}-\d{2}-\d{2}$/.test(start)
      ? new Date(+start.slice(0, 4), +start.slice(5, 7) - 1, 1)
      : new Date(now.getFullYear(), now.getMonth(), 1);
    var me = '';

    function fmt(d) {
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }
    function withKey(url) { return secret ? url + '&k=' + encodeURIComponent(secret) : url; }
    function el(tag, cls, text) {
      var n = document.createElement(tag);
      if (cls) n.className = cls;
      if (text != null) n.textContent = text;
      return n;
    }

    fetch('calendar-data.json?v=' + Date.now())
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (j) {
        DATA = j;
        for (var i = 0; i < j.events.length; i++) {
          var e = j.events[i];
          if (!byDate.has(e.date)) byDate.set(e.date, []);
          byDate.get(e.date).push(e);
        }
        document.getElementById('calGen').textContent =
          '最終更新 ' + new Date(j.generatedAt).toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo' });
        render();
        // ★お名前は「選ばせない」（2026-09-06 依田の指摘「この機能わかりずらい」）。
        //   専用リンクで入った人は、そのリンクから誰かが分かる。選ぶ手間も迷いも要らない。
        if (secret) {
          fetch('/api/me?k=' + encodeURIComponent(secret))
            .then(function (r) { return r.json(); })
            .then(function (res) {
              if (!res.ok || !res.who) return;
              me = res.who;
              var tag = document.getElementById('calMe');
              tag.textContent = res.who + ' さんとして開いています';
              tag.hidden = false;
              render();
            })
            .catch(function () { /* 名前が引けなくても、見るぶんには困らない */ });
        }
      })
      .catch(function (err) {
        var n = document.getElementById('calNotice');
        n.textContent = '予定を読み込めませんでした。時間をおいて開き直してください。（' + err.message + '）';
        n.hidden = false;
      });

    document.getElementById('calPrev').addEventListener('click', function () { view.setMonth(view.getMonth() - 1); render(); });
    document.getElementById('calNext').addEventListener('click', function () { view.setMonth(view.getMonth() + 1); render(); });
    document.getElementById('calToday').addEventListener('click', function () {
      view = new Date(now.getFullYear(), now.getMonth(), 1); render();
    });

    function render() {
      var y = view.getFullYear(), m = view.getMonth();
      document.getElementById('calMlabel').textContent = y + '年 ' + (m + 1) + '月';

      var grid = document.getElementById('calGrid');
      grid.textContent = '';
      var first = new Date(y, m, 1);
      var last = new Date(y, m + 1, 0).getDate();
      for (var b = 0; b < first.getDay(); b++) grid.appendChild(el('div', 'cal__cell is-blank'));

      for (var d = 1; d <= last; d++) {
        var date = new Date(y, m, d), key = fmt(date);
        var list = byDate.get(key) || [];
        // ★2026-09-06 依田の指示で、日付を押したら詳細ページ（day.html）へ飛ぶ形にした。
        //   参加のご回答もそちらで取る。<a> にしてあるので新しいタブで開くこともできる。
        var cell = document.createElement(list.length ? 'a' : 'div');
        if (list.length) cell.href = withKey('day.html?d=' + key);
        cell.className = 'cal__cell'
          + (list.length ? '' : ' is-nolink')
          + (date.getDay() === 0 ? ' is-sun' : '')
          + (key === todayKey ? ' is-today' : '')
          + (key < todayKey ? ' is-past' : '');
        cell.setAttribute('aria-label', (m + 1) + '月' + d + '日 大会' + list.length + '件');
        cell.appendChild(el('div', 'cal__num', String(d)));
        for (var i = 0; i < Math.min(list.length, 2); i++) {
          var e = list[i];
          var bar = el('div', 'cal__ev' + (e.yes.length ? ' is-filled' : ''),
            (e.time ? e.time + ' ' : '') + e.name);
          cell.appendChild(bar);
        }
        if (list.length > 2) cell.appendChild(el('div', 'cal__more', 'ほか' + (list.length - 2) + '件'));
        grid.appendChild(cell);
      }
      renderUpcoming();
    }

    // 右側は「本日の大会」だけ（2026-09-06 依田の指示。先の分まで並べると長くて読まれない）。
    // 今日が空の日は、次に大会がある日を1日だけ出す。
    function renderUpcoming() {
      var box = document.getElementById('calUpcoming');
      var head = document.getElementById('calDlabel');
      box.textContent = '';

      var key = todayKey, list = byDate.get(todayKey) || [];
      if (!list.length) {
        var nexts = [];
        byDate.forEach(function (l, k) { if (k > todayKey) nexts.push(k); });
        nexts.sort();
        if (!nexts.length) {
          head.textContent = '本日の大会';
          box.appendChild(el('p', 'cal__empty', 'これから先の予定はまだありません。'));
          return;
        }
        key = nexts[0]; list = byDate.get(key);
      }
      var isToday = key === todayKey;
      head.textContent = isToday ? '本日の大会' : '次の大会';

      var p = key.split('-');
      var dd = new Date(+p[0], +p[1] - 1, +p[2]);
      var a = document.createElement('a');
      a.className = 'cal__up' + (isToday ? ' is-today' : '');
      a.href = withKey('day.html?d=' + key);
      a.appendChild(el('div', 'cal__up-day',
        (dd.getMonth() + 1) + '/' + dd.getDate() + '（' + DOW[dd.getDay()] + '）' + (isToday ? '　本日' : '')));
      for (var k = 0; k < list.length; k++) {
        var ev = list[k];
        var line = el('div', 'cal__up-ev');
        if (ev.kv) {
          var kv = document.createElement('img');
          kv.className = 'cal__up-kv';
          kv.src = ev.kv; kv.alt = ''; kv.loading = 'lazy';
          line.appendChild(kv);
        }
        var body = el('div', 'cal__up-body');
        var top = el('div', 'cal__up-top');
        top.appendChild(el('span', 'cal__up-time', ev.time || '未定'));
        top.appendChild(el('span', 'cal__up-name', ev.name));
        body.appendChild(top);
        body.appendChild(el('div', 'cal__up-who' + (ev.yes.length ? '' : ' is-open'),
          ev.yes.length ? ev.yes.join('・') : '募集中'));
        line.appendChild(body);
        a.appendChild(line);
      }
      box.appendChild(a);
      box.appendChild(el('p', 'cal__up-note', 'ほかの日は左のカレンダーから選んでください。'));
    }
  })();
  </script>
</body>
</html>

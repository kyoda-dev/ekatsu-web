name: ミラー配信カレンダーの更新

# 2026-09-06 新設（依田の指示）。
# Discordのテキストの予定表は見づらいので、ブラウザの月カレンダー（/calendar）に移した。
# ここはマスターと参加可否シートを読んで calendar-data.json を書き出すだけ。
# ★2026-09-06 夜：カレンダー本体は /api/calendar-data（functions/api/calendar-data.js）がシートを直接読む形にした。
#   このファイルが作る calendar-data.json は「KV画像の場所」と「APIが落ちた時の予備」の役目だけ。鳴らなくても表示は古くならない。
#
# ★1時間ごとに回している。参加可否の回答は日中よく動くため。
#   中身が変わらなければコミットしないので、無駄なデプロイは起きない。
#   止める時は schedule の2行をコメントに戻す。
on:
  schedule:
    - cron: '5 * * * *'     # 毎時5分（UTC。JSTでも毎時5分）
  workflow_dispatch:        # 手動実行ボタン
  # ★2026-09-06：足した日の 16:05・17:05・18:05 と3回スケジュールが鳴らなかった（実行0回）。
  #   GitHubは新しい schedule をすぐ拾わないことがあるので、このファイルか生成スクリプトを
  #   押した時にも1回走らせて、鍵と手順が通ることを確かめられるようにした。
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-calendar.yml'
      - 'tools/build-calendar.js'

permissions:
  contents: write

# 前の回が走っている間に次が始まらないようにする（同じファイルを取り合わない）
concurrency:
  group: build-calendar
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 依存パッケージをインストール
        run: cd tools && npm install

      - name: calendar-data.json を作る
        env:
          ENV_PATH: /dev/null
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          MASTER_SCHEDULE_ID: ${{ secrets.MASTER_SCHEDULE_ID }}
          PARTICIPATION_SHEET_ID: ${{ secrets.PARTICIPATION_SHEET_ID }}
        run: cd tools && node build-calendar.js

      - name: 変更があればコミット＆プッシュ
        run: |
          git config user.name "e-katsu-bot"
          git config user.email "k_yoda@alonzo.jp"
          git add calendar-kv.json
          git diff --cached --quiet || git commit -m "auto: ミラー配信カレンダーを更新"
          git push
